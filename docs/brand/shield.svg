<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 184" width="160" height="184" role="img" aria-label="Swiposaur sealed shield badge">
  <defs>
    <linearGradient id="rimGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7CC" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A3D" />
      <stop offset="100%" stop-color="#0B1219" />
    </linearGradient>
    <linearGradient id="shieldInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3B2E" />
      <stop offset="100%" stop-color="#08211B" />
    </linearGradient>
    <linearGradient id="dinoCrest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5722" />
      <stop offset="45%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="dinoSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F87171" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="dinoBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="dinoLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dinoShades" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shieldShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Seal body -->
  <path
    d="M80 6 L148 30 V92 C148 134 118 162 80 178 C42 162 12 134 12 92 V30 Z"
    fill="url(#shieldBody)"
    stroke="url(#rimGold)"
    stroke-width="7"
    stroke-linejoin="round"
    filter="url(#shieldShadow)"
  />
  <path
    d="M80 19 L136 39 V91 C136 127 110 152 80 165 C50 152 24 127 24 91 V39 Z"
    fill="url(#shieldInner)"
    stroke="#FDE047"
    stroke-opacity="0.45"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Dino emblem, same shapes as the in-game logo mark -->
  <g transform="translate(80 100) scale(0.86) translate(-60 -62)">
    <g>
      <polygon points="60,6 74,32 46,32" fill="url(#dinoCrest)" stroke="#450A0A" stroke-width="3" stroke-linejoin="round" />
      <polygon points="32,18 48,40 22,40" fill="url(#dinoCrest)" stroke="#450A0A" stroke-width="3" stroke-linejoin="round" />
      <polygon points="88,18 98,40 72,40" fill="url(#dinoCrest)" stroke="#450A0A" stroke-width="3" stroke-linejoin="round" />
      <polygon points="12,38 26,54 6,54" fill="url(#dinoCrest)" stroke="#450A0A" stroke-width="2.5" stroke-linejoin="round" />
      <polygon points="108,38 114,54 94,54" fill="url(#dinoCrest)" stroke="#450A0A" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <g>
      <path d="M60 26C34 26 22 46 22 68C22 88 38 104 60 104C82 104 98 88 98 68C98 46 86 26 60 26Z" fill="url(#dinoSkin)" stroke="#450A0A" stroke-width="3.5" />
      <path d="M38 74C38 92 48 100 60 100C72 100 82 92 82 74C74 78 66 80 60 80C54 80 46 78 38 74Z" fill="url(#dinoBelly)" stroke="#78350F" stroke-width="2" />
    </g>

    <g>
      <rect x="52" y="55" width="16" height="6" rx="2" fill="#FBBF24" stroke="#451A03" stroke-width="2" />
      <rect x="25" y="48" width="31" height="20" rx="6" fill="url(#dinoShades)" stroke="#FBBF24" stroke-width="2.5" />
      <rect x="64" y="48" width="31" height="20" rx="6" fill="url(#dinoShades)" stroke="#FBBF24" stroke-width="2.5" />
      <path d="M28 52L40 52L33 64L28 64Z" fill="#FFFFFF" opacity="0.45" />
      <path d="M67 52L79 52L72 64L67 64Z" fill="#FFFFFF" opacity="0.45" />
    </g>

    <ellipse cx="54" cy="74" rx="2" ry="3" fill="#450A0A" />
    <ellipse cx="66" cy="74" rx="2" ry="3" fill="#450A0A" />

    <path d="M40 82C46 90 74 90 80 82" stroke="#450A0A" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <polygon points="46,82 50,82 48,87" fill="#FFFFFF" stroke="#450A0A" stroke-width="1" />
    <polygon points="74,82 70,82 72,87" fill="#FFFFFF" stroke="#450A0A" stroke-width="1" />
  </g>

  <!-- Verified check seal -->
  <g transform="translate(126 34)">
    <circle cx="0" cy="0" r="17" fill="#0B1219" stroke="url(#rimGold)" stroke-width="3" />
    <path d="M-7 1 L-2 6.5 L7 -4.5" stroke="#4ADE80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
